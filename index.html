<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
    <title>Aplikasi Bank MAS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
:root {
        --red: #D31238;
        --red-dark: #8e1f32;
        --red-light: #FF3B2F;
        --page-bg: #fafbfc;
        --viewport-height: 100vh;
    }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #f0f0f0;
            -webkit-text-size-adjust: 100%;
        }
        body {
            display: flex;
            justify-content: center;
        }
        button, input {
            font: inherit;
        }
        button {
            -webkit-tap-highlight-color: transparent;
        }
        .mobile-container {
            position: relative;
            width: 100%;
            max-width: 414px;
            height: var(--viewport-height);
            min-height: 0;
            background: var(--page-bg);
            overflow: hidden;
            isolation: isolate;
        }

        /* LAYAR */
        .page {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }
        #splash-page {
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: #e02434;
        }
        .splash-circle {
            position: absolute;
            border-radius: 50%;
            background: #e02434;
            box-shadow: -5px 5px 20px rgba(150,0,0,.4), inset -5px 5px 20px rgba(255,60,60,.2);
            border: 1px solid rgba(200,0,0,.2);
        }
        .splash-circle.top-right {
            width: 280px;
            height: 280px;
            top: -100px;
            right: -100px;
        }
        .splash-circle.bottom-left {
            width: 350px;
            height: 350px;
            bottom: -150px;
            left: -150px;
        }
        .splash-top-logo {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: white;
            z-index: 2;
        }
        .splash-logo-box {
            width: 18px;
            height: 18px;
            background: white;
            color: #D31238;
            border-radius: 3px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 11px;
            font-weight: bold;
        }
        .splash-top-logo span {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: .5px;
        }
        .splash-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: white;
            z-index: 2;
        }
        .splash-bebas-icon {
            width: 75px;
            height: 75px;
            margin-bottom: 1px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .splash-bebas-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        .splash-bebas-text {
            font-size: 45px;
            font-weight: 700;
            letter-spacing: -1.5px;
            line-height: 1;
        }
        .splash-bebas-sub {
            margin-left: 60px;
            margin-top: 2px;
            font-size: 9px;
            font-weight: 500;
            letter-spacing: .5px;
            opacity: .9;
        }

        /* LOGIN */
        #login-page {
            z-index: 10;
            display: none;
            background: #fff;
            overflow: hidden;
        }
        .login-content {
            position: absolute;
            inset: 0;
            z-index: 2;
            padding: 30px 20px;
            overflow-y: auto;
            overscroll-behavior: contain;
            scrollbar-width: none;
        }
        .login-content::-webkit-scrollbar {
            display: none;
        }
        .login-header {
            display: flex;
            align-items: center;
            gap: 8px;

        }
        .login-logo-box {
            width: 22px;
            height: 22px;
            background: var(--red);
            color: white;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            font-weight: bold;
        }
        .login-header span {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: .5px;
        }
        .login-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
            font-size: 20px;
            font-weight: 700;
            color: #333;
        }
        .bebas-logo {
            display: flex;
            align-items: center;
        }
        .bebas-icon {
            width: 28px;
            height: 28px;
            margin-right: 5px;
            object-fit: contain;
        }
        .bebas-text {
            color: #4B4B4B;
            font-size: 24px;
            font-weight: 700;
        }
        .greeting {
            margin-top: 20px;
            color: #4d4d4d;
            font-size: 15px;
            line-height: 1.5;
        }
        .greeting strong {
            color: #222;
        }
        .input-group {
            position: relative;
            display: flex;
            align-items: center;
            margin-top: 30px;
            padding: 12px 15px;
            border: 1px solid var(--red-dark);
            border-radius: 12px;
            background: #fff;
        }
        .input-group label {
            position: absolute;
            top: -10px;
            left: 35px;
            padding: 0 5px;
            background: #fff;
            color: var(--red-dark);
            font-size: 12px;
        }
        .input-group .fa-lock {
            margin-right: 15px;
            color: #333;
            font-size: 18px;
        }
        .input-group input {
            flex: 1;
            width: 0;
            min-width: 0;
            border: none;
            outline: none;
            background: transparent;
            color: #333;
            font-size: 16px;
        }
        .input-group input::placeholder {
            color: #999;
            font-weight: 500;
        }
        .toggle-password {
            margin-left: 10px;
            color: #000;
            font-size: 18px;
            cursor: pointer;
        }
        .forgot-password {
            margin-top: 15px;
            text-align: right;
        }
        .forgot-password a {
            color: var(--red-dark);
            font-size: 14px;
            font-weight: 600;
            text-decoration: underline;
        }
        .btn-login {
            position: relative;
            z-index: 3;
            width: 100%;
            margin-top: 35px;
            padding: 14px;
            border: none;
            border-radius: 25px;
            background: #C8102E;
            color: white;
            font-size: 16px;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
        }
        .switch-account {
            position: relative;
            z-index: 3;
            margin-top: 35px;
            text-align: center;
        }
        .switch-account p {
            margin-bottom: 15px;
            color: #222;
            font-size: 14px;
            font-weight: 500;
        }
        .btn-switch {
            width: 250px;
            max-width: 100%;
            padding: 12px 25px;
            border: 1px solid var(--red-dark);
            border-radius: 25px;
            background: white;
            color: var(--red-dark);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        /*
 Shape dipisahkan dari area yang bisa discroll.
 Posisi dasarnya mengikuti viewport yang dikunci saat halaman dibuka.
*/
        .shape-layer {
            position: absolute;
            left: -60px;
            bottom: -20px;
            width: calc(100% + 40px);
            height: 250px;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }
        .bottom-shapes {
            display: block;
            position: absolute;
            left: 0;
            width: 100%;
            height: 100%;
            margin: 0;
        }

        /* LOADING */
        #loading-page {
            z-index: 50;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(255,255,255,.92);
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--red);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        #loading-page p {
            margin-top: 15px;
            color: #333;
            font-size: 14px;
            font-weight: 600;
        }

        /* DASHBOARD */
        #dashboard-page {
            z-index: 5;
            display: none;
            overflow-x: hidden;
            overflow-y: auto;
            padding-bottom: 85px;
            background: var(--page-bg);
            -webkit-overflow-scrolling: touch;
        }
        .dash-top-bg {
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 220px;
            z-index: 0;
            overflow: hidden;
        }
        .dash-top-bg svg {
            position: absolute;
            top: 0;
            right: 0;
            width: 180px;
            height: 100%;
        }
        .dash-header {
            position: relative;
            z-index: 2;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 15px 5px;
        }
        .dash-logo-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .dash-logo-box {
            width: 16px;
            height: 16px;
            background: var(--red);
            color: white;
            border-radius: 3px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 10px;
            font-weight: bold;
        }
        .dash-logo-group span {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: .5px;
        }
        .dash-header-actions {
            display: flex;
            gap: 8px;
        }
        .icon-btn {
            position: relative;
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background: white;
            color: #333;
            box-shadow: 0 2px 8px rgba(0,0,0,.05);
            font-size: 13px;
        }
        .notif-dot {
            position: absolute;
            top: 7px;
            right: 7px;
            width: 6px;
            height: 6px;
            border: 1px solid white;
            border-radius: 50%;
            background: var(--red);
        }
        .account-card {
            position: relative;
            z-index: 2;
            margin: 12px 15px;
            padding: 15px;
            border: 1px solid #f9f9f9;
            border-radius: 12px;
            background: linear-gradient(to right,#fff,#fffdfd);
            box-shadow: 0 3px 10px rgba(0,0,0,.04);
        }
        .user-name {
            margin-bottom: 10px;
            color: #111;
            font-size: 12px;
            font-weight: 700;
        }
        .card-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .balance-info {
            flex: 1;
            min-width: 0;
            margin-right: 12px;
            padding: 10px;
            border: 1px solid #f0f0f0;
            border-radius: 10px;
            background: white;
        }
        .acc-number {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 5px;
            color: #555;
            font-size: 9px;
            white-space: nowrap;
        }
        .acc-number i {
            color: #777;
            font-size: 10px;
            cursor: pointer;
        }
        .acc-number .fa-thumbtack {
            color: #F2A900;
        }
        .balance-amount {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            color: #111;
            font-size: 14px;
            font-weight: 700;
        }
        .balance-amount i {
            color: #666;
            font-size: 12px;
            cursor: pointer;
        }
        .bebas-poin {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 75px;
        }
        .bebas-poin-icon {
            width: 20px;
            height: 20px;
            margin-bottom: 4px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--red);
            color: white;
            font-size: 12px;
            font-weight: bold;
        }
        .bebas-poin-title {
            color: #111;
            font-size: 9.5px;
            font-weight: 700;
        }
        .bebas-poin-link {
            margin-top: 1px;
            color: var(--red);
            font-size: 8.5px;
            font-weight: 500;
        }
        .section-container {
            margin: 12px 15px;
            padding: 15px;
            border-radius: 12px;
            background: white;
            box-shadow: 0 2px 8px rgba(0,0,0,.02);
        }
        .section-title {
            margin-bottom: 15px;
            color: #111;
            font-size: 13px;
            font-weight: 700;
        }
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(4,minmax(0,1fr));
            row-gap: 15px;
            column-gap: 8px;
        }
        .menu-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
        }
        .menu-icon {
            margin-bottom: 6px;
            color: var(--red);
            font-size: 20px;
        }
        .menu-text {
            color: #222;
            font-size: 9px;
            font-weight: 500;
        }
        .info-section {
            margin: 15px 15px 0;
        }
        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 3px;
        }
        .see-all {
            color: var(--red);
            font-size: 10px;
            font-weight: 600;
            text-decoration: none;
            white-space: nowrap;
        }
        .subtitle {
            margin-bottom: 15px;
            color: #555;
            font-size: 10px;
        }
        .no-promo {
            padding: 5px 0 15px;
            color: var(--red);
            font-size: 12px;
            font-weight: 600;
            text-align: center;
        }
        .bottom-nav {
            position: fixed;
            left: 50%;
            bottom: 0;
            transform: translateX(-50%);
            width: min(100%,414px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 0 max(8px, env(safe-area-inset-bottom));
            background: white;
            box-shadow: 0 -2px 10px rgba(0,0,0,.04);
            z-index: 100;
        }
        .nav-item {
            display: flex;
            flex: 1;
            flex-direction: column;
            align-items: center;
            color: #888;
            font-size: 9px;
            font-weight: 500;
            text-decoration: none;
        }
        .nav-item.active {
            color: var(--red);
        }
        .nav-item i {
            margin-bottom: 3px;
            font-size: 17px;
        }
        .nav-qris {
            position: relative;
            top: -15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .qris-btn {
            width: 46px;
            height: 46px;
            border: 3px solid white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg,#FF3B2F,#9e0413);
            color: white;
            font-size: 12px;
            font-weight: 700;
            box-shadow: 0 4px 8px rgba(211,18,56,.3);
        }
        @media (max-width: 350px) {
            .login-title {
                font-size: 21px;
                gap: 6px;
            }
            .bebas-text {
                font-size: 22px;
            }
            .account-card {
                margin-left: 10px;
                margin-right: 10px;
                padding: 10px;
            }
            .acc-number {
                font-size: 8px;
                gap: 3px;
            }
        }
    </style>
</head>

<body>
    <div class="mobile-container" id="app">

        <!-- 1. SPLASH SCREEN -->
        <section class="page" id="splash-page">
            <div class="splash-circle top-right"></div>
            <div class="splash-circle bottom-left"></div>
            <div class="splash-top-logo">
                <div class="splash-logo-box">
                    B
                </div>
                <span>BANK MAS</span>
            </div>
            <div class="splash-center">
                <div class="splash-bebas-icon">
                    <img src="logo.png" alt="Logo">
                </div>
                <div class="splash-bebas-text">
                    bebas
                </div>
                <div class="splash-bebas-sub">
                    by BANK MAS
                </div>
            </div>
        </section>

        <!-- 2. LOGIN -->
        <section class="page" id="login-page">
            <div class="login-content" id="login-content">
                <div class="login-header">
                    <div class="login-logo-box">
                        B
                    </div>
                    <span>BANK MAS</span>
                </div>
                <div class="login-title">
                    Login ke
                    <div class="bebas-logo">
                        <img src="b.png" class="bebas-icon" alt="">
                        <span class="bebas-text">bebas</span>
                    </div>
                </div>
                <p class="greeting">
                    Halo, <strong>Suyitno</strong>. Masukkan password kamu<br>untuk melanjutkan
                </p>

                <div class="input-group">
                    <label for="input-passwor
